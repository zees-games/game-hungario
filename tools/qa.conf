# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the client bench has no mode switch, so "classic" is the real client against the real server and module on its default mode, with 8 of the module's bots.
PERF_CASES=classic
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --bots 8 --seconds "$2" --json
}

# A case is a mode id; tools/screenshot_map.sh leaves screenshots/<mode>_<shot>.png.
VISUAL_CASES="warrens reef"
VISUAL_SHOTS="arena gate"

visual_render() { heavy -- timeout 600 tools/screenshot_map.sh "$1"; }
